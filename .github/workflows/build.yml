name: Build

# Po každém pushi: kontrola kódu, Android APK/AAB jako artefakt
# a iOS IPA nahrané do TestFlightu.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.8"

jobs:
  # Zjistí, jestli jsou nastavené podpisové secrety. Bez nich se buildy
  # přeskočí, aby workflow nespadl hned po prvním pushi.
  config:
    name: Kontrola konfigurace
    runs-on: ubuntu-latest
    outputs:
      android_signing: ${{ steps.check.outputs.android_signing }}
      ios_release: ${{ steps.check.outputs.ios_release }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "android_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 chybí - APK se podepíše debug klíčem."
          fi

          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] \
             && [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "ios_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS secrety nejsou kompletní - build pro TestFlight se přeskakuje."
          fi

  test:
    name: Analyze + testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + AAB)
    needs: [config, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Podpisový keystore
        if: needs.config.outputs.android_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # PKCS12 = keystore z tools/create-android-keystore.sh.
          # Pro keystore z keytoolu (.jks) nastav variable na JKS.
          ANDROID_KEYSTORE_TYPE: ${{ vars.ANDROID_KEYSTORE_TYPE || 'PKCS12' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release-keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=$ANDROID_KEYSTORE_TYPE
          PROPS

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Přejmenování podle běhu
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/RenoWorkshop-${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "artifacts/RenoWorkshop-${{ github.run_number }}.aab"

      - name: Artefakty ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: artifacts/*
          retention-days: 60
          if-no-files-found: error

      - name: Release při tagu v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  ios:
    name: iOS (TestFlight)
    needs: [config, test]
    # PR se na TestFlight neposílají a bez secretů to nemá smysl pouštět.
    if: needs.config.outputs.ios_release == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build IPA a upload do TestFlightu
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane beta

      - name: IPA ke stažení
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 60
          if-no-files-found: warn
