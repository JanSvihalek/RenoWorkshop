name: Sestavení aplikace

# Stejná kostra jako v RenoCharge: kontrola a testy na Linuxu, na ně
# navazují oba buildy. macOS runner se pouští jen z main a ručně - na
# privátním repozitáři by se účtoval desetinásobkem minut a nemá smysl
# stavět iOS z každé pracovní větve.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.8
  BUNDLE_ID: dev.svihalek.renoworkshop

  # Číslo buildu = pořadí běhu + tenhle posun. GitHub počítá `run_number`
  # zvlášť pro každý soubor s workflow, takže po přejmenování souboru
  # začne od jedničky a App Store Connect nové buildy odmítne jako už
  # použité. Při dalším přejmenování posun zvýšit nad nejvyšší nahrané
  # číslo; snížit ho nejde nikdy.
  POSUN_BUILDU: 100

jobs:
  kontrola:
    name: Analýza a testy
    runs-on: ubuntu-latest
    outputs:
      cislo_buildu: ${{ steps.verze.outputs.cislo }}
    steps:
      - uses: actions/checkout@v4

      # Počítá se jednou tady a obě platformy si ho vezmou, ať nesou
      # buildy se stejným číslem stejný kód.
      - name: Číslo buildu
        id: verze
        run: |
          set -euo pipefail
          CISLO=$(( POSUN_BUILDU + GITHUB_RUN_NUMBER ))
          echo "cislo=$CISLO" >> "$GITHUB_OUTPUT"
          echo "Build číslo $CISLO"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Závislosti
        run: flutter pub get

      - name: Formátování
        run: dart format --set-exit-if-changed lib test

      - name: Analýza
        run: flutter analyze

      - name: Testy
        run: flutter test

  android:
    name: Sestavení APK
    needs: kontrola
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin i Flutter chtějí JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Bez keystoru podepisuje Gradle ladicím klíčem. Ten na jednorázovém
      # runneru pokaždé vzniká znovu, takže se podpis mezi běhy liší a tester
      # musí před instalací novější verze tu starou odinstalovat.
      # Keystore se vyrábí přes tools/create-android-keystore.sh.
      - name: Podpisový klíč
        id: klic
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::APK se podepíše ladicím klíčem - před instalací nové verze odinstalujte starou."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/keystore.p12"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/keystore.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=PKCS12
          PROPS
          echo "Podepisuje se vlastním klíčem."

      - name: Závislosti
        run: flutter pub get

      # Jeden univerzální APK, ne rozdělený podle architektur - jde o ruční
      # instalaci na telefony na dílně, ne o distribuci přes obchod.
      # Číslo buildu je stejné jako u iOS, ať se dá poznat, co má tester
      # nainstalované, bez ohledu na platformu.
      - name: Sestavení APK
        run: |
          flutter build apk --release \
            --build-number=${{ needs.kontrola.outputs.cislo_buildu }}

      - name: Velikost a podpis
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5

      - name: Uložení APK
        uses: actions/upload-artifact@v4
        with:
          name: RenoWorkshop-apk-${{ needs.kontrola.outputs.cislo_buildu }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 60
          if-no-files-found: error

  ios:
    name: Sestavení a TestFlight
    # Nemá smysl platit za macOS minuty, když neprojde analýza.
    needs: kontrola
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64
          cache: true

      - name: Závislosti
        run: flutter pub get

      # Bez tohohle by se chybějící secret projevil až surovou chybou
      # z `security import`, ze které není poznat, co vlastně chybí.
      - name: Kontrola secretů
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          chybi=''
          for jmeno in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!jmeno}" ]; then chybi="$chybi $jmeno"; fi
          done
          if [ -n "$chybi" ]; then
            echo "::error::Chybí secrety:$chybi - viz docs/NASTAVENI.md"
            exit 1
          fi

          # Odřádkování v hesle shodí import certifikátu a z hlášky
          # to není poznat, proto kontrola rovnou tady.
          if [ "$(printf '%s' "$IOS_DIST_CERT_PASSWORD" | wc -l)" -ne 0 ]; then
            echo "::error::IOS_DIST_CERT_PASSWORD obsahuje odřádkování - ulož secret znovu bez konce řádku."
            exit 1
          fi

          echo "Potřebné secrety jsou vyplněné."
          echo "Certifikát: ${#IOS_DIST_CERT_P12_BASE64} znaků, profil: ${#IOS_PROVISIONING_PROFILE_BASE64} znaků."
      # Certifikát se importuje do dočasné klíčenky, ne do výchozí - runner
      # je sice jednorázový, ale takhle je jasné, co po sobě build zanechá.
      - name: Klíčenka s podpisovým certifikátem
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/podpis.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # openssl místo base64: BSD a GNU varianta base64 se liší
          # v přepínači pro dekódování.
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Bez zařazení do seznamu klíčenek ji codesign nenajde.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "Nalezené podpisové identity:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Profil se neinstaluje pod vlastním jménem, ale pod svým UUID - tak ho
      # Xcode hledá. Jméno, UUID i team se čtou přímo z profilu, aby to
      # nezáviselo na tom, jestli secret s názvem sedí znak po znaku.
      - name: Provisioning profil
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFIL="$RUNNER_TEMP/build.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$PROFIL"

          # .mobileprovision je CMS-podepsaný plist, tohle z něj udělá plist.
          security cms -D -i "$PROFIL" > "$RUNNER_TEMP/profil.plist"
          NAZEV=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profil.plist")
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profil.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profil.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profil.plist")
          PLATNOST=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profil.plist")

          echo "Profil:    $NAZEV"
          echo "UUID:      $UUID"
          echo "Aplikace:  $APPID"
          echo "Platnost:  $PLATNOST"

          # Nesouhlasící bundle ID by se jinak projevilo až nesrozumitelnou
          # chybou při archivaci.
          case "$APPID" in
            *".$BUNDLE_ID")
              ;;
            *)
              echo "::error::Profil je pro $APPID, ale appka má $BUNDLE_ID. Vyrob profil pro správné App ID."
              exit 1
              ;;
          esac

          # Xcode 16+ hledá profily jinde než starší verze, tak je položíme
          # na obě místa, pojmenované podle UUID.
          STARE="$HOME/Library/MobileDevice/Provisioning Profiles"
          NOVE="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$STARE" "$NOVE"
          cp "$PROFIL" "$STARE/$UUID.mobileprovision"
          cp "$PROFIL" "$NOVE/$UUID.mobileprovision"

          # Pro další kroky - podpis i export berou hodnoty odsud, ne ze secretů.
          echo "PROFILE_NAME=$NAZEV" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM=$TEAM" >> "$GITHUB_ENV"
      # Team i profil pocházejí z kroku "Provisioning profil" (přes GITHUB_ENV),
      # takže se nemůžou rozejít s tím, co je v profilu doopravdy.
      - name: Nastavení exportu
        run: |
          set -euo pipefail
          TEAM_ID="$PROFILE_TEAM"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # TestFlight odmítne nahrát dvakrát stejné číslo, takže napevno zapsaná
      # jednička z pubspec.yaml by prošla jen jednou. Odkud se číslo bere,
      # viz POSUN_BUILDU nahoře.
      - name: Přeložení Flutteru
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ needs.kontrola.outputs.cislo_buildu }}

      # Podpis se nesmí předávat přes příkazovou řádku xcodebuildu - ta má
      # nejvyšší prioritu a platí pro všechny cíle ve workspace, tedy i pro
      # pody, které provisioning profil nepodporují. Release.xcconfig je
      # základ konfigurace jen pro cíl Runner. Dopisuje se až po překladu,
      # aby to nepřepsal pod install.
      - name: Podpis pro cíl Runner
        run: |
          set -euo pipefail
          cat >> ios/Flutter/Release.xcconfig <<CFG

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${PROFILE_TEAM}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_UUID}
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          CFG
          cat ios/Flutter/Release.xcconfig

      - name: Archiv
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"

      # Číslo buildu se do Info.plist dostává oklikou: flutter build zapíše
      # FLUTTER_BUILD_NUMBER do Generated.xcconfig a Info.plist na něj jen
      # odkazuje. Když ta cesta selže, archiv nese číslo z pubspec.yaml
      # a App Store Connect ho odmítne jako duplicitní - ale až asynchronně,
      # takže by workflow zůstal zelený. Proto kontrola tady.
      - name: Kontrola čísla buildu
        env:
          OCEKAVANE: ${{ needs.kontrola.outputs.cislo_buildu }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          VERZE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "Verze $VERZE, build $BUILD"
          if [ "$BUILD" != "$OCEKAVANE" ]; then
            echo "::error::Archiv nese build $BUILD, čekal se $OCEKAVANE."
            exit 1
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Uložení IPA
        uses: actions/upload-artifact@v4
        with:
          name: RenoWorkshop-ipa-${{ needs.kontrola.outputs.cislo_buildu }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 60
          if-no-files-found: error

      - name: Nahrání do TestFlightu
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool hledá klíč v ~/private_keys pod přesným názvem.
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -1)"

          # Nahrávací služba Applu občas vrátí 500 nebo 409
          # STATE_ERROR.UPDATING (na zdroji zrovna pracuje jiný požadavek).
          # Je to přechodné, takže se to zkusí třikrát, než build spadne.
          for pokus in 1 2 3; do
            echo "Nahrávám $IPA (pokus $pokus)"
            if xcrun altool --upload-app -f "$IPA" -t ios \
                 --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"; then
              exit 0
            fi
            if [ "$pokus" -lt 3 ]; then
              echo "::warning::Apple odmítl nahrání, zkouším znovu za 90 s."
              sleep 90
            fi
          done

          echo "::error::Nahrání do TestFlightu se nepodařilo ani napotřetí."
          exit 1
