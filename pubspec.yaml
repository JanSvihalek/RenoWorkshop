name: renoworkshop
description: "RenoWorkshop - interní dílenský tracker servisních zakázek RENOCAR a.s."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management - viz docs/ARCHITECTURE.md (Riverpod, bez code generation).
  flutter_riverpod: ^2.6.1

  # Deklarativní routing + auth guard (redirect).
  go_router: ^17.5.0

  # Formátování datumů v české lokalizaci.
  intl: ^0.20.2

  # Lokalizace Material/Cupertino widgetů (cs_CZ).
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  local_auth: ^3.0.2
  http: ^1.6.0
  google_mlkit_text_recognition: ^0.16.0
  camera: ^0.12.0+2
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/icon/png/adaptive/renoworkshop-foreground-432.png

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
